
name: My First GitHub Actions Workflow

on:
  push:
    branches:
      - main

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display repository files
        run: ls -la

      - name: Display confirmation message
        run: echo "Repository checkout completed successfully!"

              - name: Validate Dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "Dockerfile exists!"
          else
            echo "Dockerfile is missing!"
            exit 1
          fi
